# The `simp:defaults` Sicura Compliance Engine profile.
#
# Enforcing it (Hiera `compliance_engine::enforcement: [simp:defaults]`) restores
# the SSSD configuration this module managed by default before 11.0.0. Checks
# are listed directly (no controls indirection) and defined in checks.yaml.
---
version: 2.0.0
profiles:
  simp:defaults:
    checks:
      simp:defaults.sssd.service.ensure: true
      simp:defaults.sssd.service.enable: true
      simp:defaults.sssd.services_entries: true
      simp:defaults.sssd.auto_add_ipa_domain: true
      simp:defaults.sssd.tidy_puppet_snippets: true
      simp:defaults.sssd.debug_timestamps: true
      simp:defaults.sssd.debug_microseconds: true
      simp:defaults.sssd.service.nss.debug_timestamps: true
      simp:defaults.sssd.service.nss.debug_microseconds: true
      simp:defaults.sssd.service.nss.enum_cache_timeout: true
      simp:defaults.sssd.service.nss.entry_cache_nowait_percentage: true
      simp:defaults.sssd.service.nss.entry_negative_timeout: true
      simp:defaults.sssd.service.nss.filter_users: true
      simp:defaults.sssd.service.nss.filter_groups: true
      simp:defaults.sssd.service.nss.filter_users_in_groups: true
      simp:defaults.sssd.service.pam.debug_timestamps: true
      simp:defaults.sssd.service.pam.debug_microseconds: true
      simp:defaults.sssd.service.pam.offline_credentials_expiration: true
      simp:defaults.sssd.service.pam.offline_failed_login_attempts: true
      simp:defaults.sssd.service.pam.offline_failed_login_delay: true
      simp:defaults.sssd.service.pam.pam_verbosity: true
      simp:defaults.sssd.service.pam.pam_id_timeout: true
      simp:defaults.sssd.service.pam.pam_pwd_expiration_warning: true
      simp:defaults.sssd.service.ssh.debug_timestamps: true
      simp:defaults.sssd.service.ssh.debug_microseconds: true
      simp:defaults.sssd.service.sudo.debug_timestamps: true
      simp:defaults.sssd.service.sudo.debug_microseconds: true
      simp:defaults.sssd.service.sudo.sudo_threshold: true
      simp:defaults.sssd.service.sudo.sudo_timed: true
      simp:defaults.sssd.service.sudo.socket_enable: true
      simp:defaults.sssd.config.sssd_config_dir_mode.RedHat-8: true
      simp:defaults.sssd.config.sssd_config_dir_mode.RedHat-9: true
      simp:defaults.sssd.config.sssd_config_dir_mode.RedHat-10: true
      simp:defaults.sssd.config.manage_base_domain.RedHat-10: true
      simp:defaults.sssd.domains_entries.RedHat-10: true
      simp:defaults.sssd.config_file_version.RedHat-8: true
      simp:defaults.sssd.config_file_version.RedHat-9: true
      simp:defaults.sssd.reconnection_retries.RedHat-8: true
      simp:defaults.sssd.reconnection_retries.RedHat-9: true
      simp:defaults.sssd.enable_files_domain.RedHat-8: true
      simp:defaults.sssd.enable_files_domain.RedHat-9: true
      simp:defaults.sssd.service.nss.reconnection_retries.RedHat-8: true
      simp:defaults.sssd.service.nss.reconnection_retries.RedHat-9: true
      simp:defaults.sssd.service.pam.reconnection_retries.RedHat-8: true
      simp:defaults.sssd.service.pam.reconnection_retries.RedHat-9: true
      simp:defaults.sssd.service.ssh.ssh_hash_known_hosts.RedHat-8: true
      simp:defaults.sssd.service.ssh.ssh_hash_known_hosts.RedHat-9: true
      simp:defaults.sssd.service.sudo.manage_group_dropin_file.RedHat-8: true
      simp:defaults.sssd.service.sudo.manage_group_dropin_file.RedHat-9: true
